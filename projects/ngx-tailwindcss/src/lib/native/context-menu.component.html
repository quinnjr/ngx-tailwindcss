@if (isOpen()) {
  <div
    #menu
    class="fixed z-50 min-w-48 py-1 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700"
    [style.left.px]="position().x"
    [style.top.px]="position().y"
    role="menu"
    [attr.aria-label]="'Context menu'"
    (keydown)="onMenuKeydown($event)"
  >
    @for (item of items(); track item.id) {
      @if (item.type === 'separator') {
        <div class="h-px my-1 mx-2 bg-gray-200 dark:bg-gray-700" role="separator"></div>
      } @else {
        <!-- Hover state lives on the wrapper so moving into the submenu keeps it open -->
        <div
          class="relative"
          (mouseenter)="hoveredItemId.set(item.id)"
          (mouseleave)="hoveredItemId.set(null)"
        >
          <button
            type="button"
            class="w-full px-3 py-1.5 flex items-center gap-3 text-left text-sm transition-colors focus:outline-none focus-visible:bg-blue-500 focus-visible:text-white"
            tabindex="-1"
            [attr.data-menu-item-id]="item.id"
            [attr.aria-haspopup]="item.type === 'submenu' && item.submenu?.length ? 'menu' : null"
            [attr.aria-expanded]="
              item.type === 'submenu' && item.submenu?.length ? hoveredItemId() === item.id : null
            "
            [attr.aria-checked]="
              item.type === 'checkbox' || item.type === 'radio' ? !!item.checked : null
            "
            [class.bg-blue-500]="hoveredItemId() === item.id && !item.disabled"
            [class.text-white]="hoveredItemId() === item.id && !item.disabled"
            [class.hover:bg-blue-500]="!item.disabled"
            [class.hover:text-white]="!item.disabled"
            [class.text-gray-700]="hoveredItemId() !== item.id"
            [class.dark:text-gray-300]="hoveredItemId() !== item.id"
            [class.opacity-50]="item.disabled"
            [class.cursor-not-allowed]="item.disabled"
            [attr.role]="
              item.type === 'checkbox'
                ? 'menuitemcheckbox'
                : item.type === 'radio'
                  ? 'menuitemradio'
                  : 'menuitem'
            "
            [attr.aria-disabled]="item.disabled"
            [disabled]="item.disabled"
            (click)="selectItem(item, $event)"
          >
            <!-- Icon -->
            @if (item.icon) {
              <span class="w-4 text-center opacity-70">{{ item.icon }}</span>
            }

            <!-- Checkbox/Radio indicator -->
            @if (item.type === 'checkbox' || item.type === 'radio') {
              <span class="w-4 flex items-center justify-center">
                @if (item.checked) {
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16">
                    <path
                      d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"
                    />
                  </svg>
                }
              </span>
            }

            <!-- Label -->
            <span class="flex-1">{{ item.label }}</span>

            <!-- Shortcut -->
            @if (item.shortcut) {
              <span class="ml-6 text-xs opacity-75 font-mono">
                {{ formatShortcut(item.shortcut) }}
              </span>
            }

            <!-- Submenu arrow -->
            @if (item.type === 'submenu' && item.submenu?.length) {
              <svg class="w-3 h-3 opacity-60" fill="currentColor" viewBox="0 0 16 16">
                <path
                  d="M6.22 4.22a.75.75 0 011.06 0l3.25 3.25a.75.75 0 010 1.06l-3.25 3.25a.75.75 0 01-1.06-1.06L8.94 8 6.22 5.28a.75.75 0 010-1.06z"
                />
              </svg>
            }
          </button>

          <!-- Submenu -->
          @if (item.type === 'submenu' && item.submenu?.length && hoveredItemId() === item.id) {
            <div
              class="absolute left-full top-0 min-w-44 py-1 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700"
              role="menu"
              [attr.aria-label]="item.label"
            >
              @for (subItem of item.submenu; track subItem.id) {
                @if (subItem.type === 'separator') {
                  <div class="h-px my-1 mx-2 bg-gray-200 dark:bg-gray-700" role="separator"></div>
                } @else {
                  <button
                    type="button"
                    class="w-full px-3 py-1.5 flex items-center gap-3 text-left text-sm transition-colors hover:bg-blue-500 hover:text-white text-gray-700 dark:text-gray-300 focus:outline-none focus-visible:bg-blue-500 focus-visible:text-white"
                    tabindex="-1"
                    [class.opacity-50]="subItem.disabled"
                    [attr.role]="
                      subItem.type === 'checkbox'
                        ? 'menuitemcheckbox'
                        : subItem.type === 'radio'
                          ? 'menuitemradio'
                          : 'menuitem'
                    "
                    [attr.aria-checked]="
                      subItem.type === 'checkbox' || subItem.type === 'radio'
                        ? !!subItem.checked
                        : null
                    "
                    [disabled]="subItem.disabled"
                    (click)="selectItem(subItem, $event)"
                  >
                    @if (subItem.icon) {
                      <span class="w-4 text-center opacity-70">{{ subItem.icon }}</span>
                    }
                    @if (subItem.type === 'checkbox' || subItem.type === 'radio') {
                      <span class="w-4 flex items-center justify-center">
                        @if (subItem.checked) {
                          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16">
                            <path
                              d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"
                            />
                          </svg>
                        }
                      </span>
                    }
                    <span class="flex-1">{{ subItem.label }}</span>
                    @if (subItem.shortcut) {
                      <span class="ml-4 text-xs opacity-75">{{
                        formatShortcut(subItem.shortcut)
                      }}</span>
                    }
                  </button>
                }
              }
            </div>
          }
        </div>
      }
    }
  </div>
}
