<footer [class]="containerClasses()" role="status">
  <!-- Left items -->
  <div class="flex items-center gap-2 min-w-0">
    @for (item of leftItems(); track item.id) {
      <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
    }
  </div>

  <!-- Center items -->
  <div class="flex items-center gap-2">
    @for (item of centerItems(); track item.id) {
      <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
    }
  </div>

  <!-- Right items -->
  <div class="flex items-center gap-2 min-w-0">
    @for (item of rightItems(); track item.id) {
      <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
    }
  </div>
</footer>

<!-- Item template -->
<ng-template #itemTemplate let-item>
  @if (item.clickable) {
    <button
      type="button"
      class="flex items-center gap-1 px-1.5 py-0.5 rounded transition-colors truncate"
      [ngClass]="buttonHoverClass()"
      [attr.title]="item.tooltip"
      (click)="onItemClick(item)"
    >
      @if (item.icon) {
        <span class="flex-shrink-0">{{ item.icon }}</span>
      }
      <span class="truncate">{{ item.content }}</span>
    </button>
  } @else {
    <span class="flex items-center gap-1 px-1.5 truncate" [attr.title]="item.tooltip">
      @if (item.icon) {
        <span class="flex-shrink-0">{{ item.icon }}</span>
      }
      <span class="truncate">{{ item.content }}</span>
    </span>
  }
</ng-template>
