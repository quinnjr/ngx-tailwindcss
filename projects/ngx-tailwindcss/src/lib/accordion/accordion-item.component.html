<div [class]="itemClasses()">
  <div role="heading" [attr.aria-level]="_headingLevel()">
    <button
      type="button"
      [id]="headerId"
      [class]="headerClasses()"
      [disabled]="isDisabled()"
      [attr.aria-disabled]="isDisabled()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="panelId"
      (click)="toggle()"
    >
      <span class="flex-1 text-left">
        <ng-content select="[twAccordionHeader]"></ng-content>
        @if (!hasHeaderContent) {
          {{ itemTitleValue() }}
        }
      </span>
      <svg
        [class]="iconClasses()"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
      </svg>
    </button>
  </div>
  <!-- Kept in the DOM while collapsed so the header's aria-controls always resolves -->
  <div
    [id]="panelId"
    role="region"
    [attr.aria-labelledby]="headerId"
    [class]="contentClasses()"
    [hidden]="!isOpen()"
  >
    <ng-content></ng-content>
  </div>
</div>
