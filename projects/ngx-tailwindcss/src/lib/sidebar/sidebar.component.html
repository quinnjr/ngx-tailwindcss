<!-- Backdrop -->
@if (visible() && showBackdrop()) {
  <div [class]="backdropClasses()" (click)="onBackdropClick()" aria-hidden="true"></div>
}

<!-- Sidebar panel -->
<!-- Modal sidebars move focus inside and trap Tab while open; focus is restored on hide -->
<div
  [class]="panelClasses()"
  [twFocusTrap]="visible() && modal()"
  [focusTrapRestoreFocus]="false"
  [attr.aria-hidden]="!visible()"
  [attr.inert]="visible() ? null : ''"
  role="dialog"
  [attr.aria-modal]="modal() ? 'true' : null"
  [attr.aria-label]="header() || ariaLabel() || null"
  [attr.aria-labelledby]="header() ? null : ariaLabelledBy() || null"
>
  <!-- Header -->
  @if (header() || showCloseButton()) {
    <div [class]="headerClasses()">
      @if (header()) {
        <h2 class="text-lg font-semibold text-slate-900 dark:text-slate-100">{{ header() }}</h2>
      }
      @if (showCloseButton()) {
        <button
          type="button"
          class="p-2 rounded-lg text-slate-500 hover:text-slate-700 hover:bg-slate-100 dark:text-slate-400 dark:hover:text-slate-200 dark:hover:bg-slate-700 transition-colors"
          (click)="hide()"
          aria-label="Close sidebar"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      }
    </div>
  }

  <!-- Content -->
  <div [class]="contentClasses()">
    <ng-content></ng-content>
  </div>

  <!-- Footer -->
  @if (footerTemplate) {
    <div [class]="footerClasses()">
      <ng-container *ngTemplateOutlet="footerTemplate"></ng-container>
    </div>
  } @else {
    <!-- Fallback slot for attribute-marked footers; hidden when nothing is projected -->
    <div class="empty:hidden" [class]="footerClasses()">
      <ng-content select="[twSidebarFooter]"></ng-content>
    </div>
  }
</div>
