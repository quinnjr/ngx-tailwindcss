<app-page-header
  title="Progress"
  description="Progress bar and circular progress components for displaying completion status.">
</app-page-header>

<div class="space-y-8">
  <!-- Basic -->
  <app-demo-section title="Basic Usage" [code]="basicCode">
    <div class="max-w-md">
      <tw-progress label="Upload progress" [value]="progress"></tw-progress>
      <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">{{ progress }}% complete</p>
    </div>
  </app-demo-section>

  <!-- Variants -->
  <app-demo-section title="Variants" [code]="variantsCode">
    <div class="max-w-md space-y-4">
      <div>
        <tw-progress label="Primary (75%)" variant="primary" [value]="75"></tw-progress>
      </div>
      <div>
        <tw-progress label="Success (100%)" variant="success" [value]="100"></tw-progress>
      </div>
      <div>
        <tw-progress label="Warning (50%)" variant="warning" [value]="50"></tw-progress>
      </div>
      <div>
        <tw-progress label="Danger (25%)" variant="danger" [value]="25"></tw-progress>
      </div>
    </div>
  </app-demo-section>

  <!-- Sizes -->
  <app-demo-section title="Sizes" [code]="sizesCode">
    <div class="max-w-md space-y-4">
      <div>
        <tw-progress label="Small" size="sm" [value]="60"></tw-progress>
      </div>
      <div>
        <tw-progress label="Medium" size="md" [value]="60"></tw-progress>
      </div>
      <div>
        <tw-progress label="Large" size="lg" [value]="60"></tw-progress>
      </div>
    </div>
  </app-demo-section>

  <!-- Striped -->
  <app-demo-section title="Striped & Animated" [code]="stripedCode">
    <div class="max-w-md space-y-4">
      <div>
        <tw-progress label="Striped" [value]="70" [striped]="true"></tw-progress>
      </div>
      <div>
        <tw-progress label="Striped Animated" [value]="70" [striped]="true" [animated]="true"></tw-progress>
      </div>
    </div>
  </app-demo-section>

  <!-- With Value -->
  <app-demo-section title="Show Value" [code]="labelCode">
    <div class="max-w-md">
      <tw-progress label="Profile completion" [value]="75" [showValue]="true"></tw-progress>
    </div>
  </app-demo-section>

  <!-- Indeterminate -->
  <app-demo-section title="Indeterminate" [code]="indeterminateCode">
    <div class="max-w-md">
      <tw-progress label="Loading" [indeterminate]="true"></tw-progress>
    </div>
  </app-demo-section>

  <!-- Circular -->
  <app-demo-section title="Circular Progress" [code]="circularCode">
    <div class="flex items-center gap-6">
      <tw-progress-circular [value]="25" [size]="48" label="Upload progress"></tw-progress-circular>
      <tw-progress-circular [value]="50" [size]="64" label="Sync progress"></tw-progress-circular>
      <tw-progress-circular [value]="75" [size]="80" [showValue]="true" label="Download progress"></tw-progress-circular>
      <tw-progress-circular [indeterminate]="true" [size]="64" label="Loading"></tw-progress-circular>
    </div>
  </app-demo-section>
</div>
