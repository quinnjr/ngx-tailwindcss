<div [class]="containerClasses()">
  <!-- Tab list -->
  <div [class]="tabListClasses()" role="tablist" [attr.aria-orientation]="orientation()">
    @for (panel of panels; track panel.value()) {
      <button
        #tabButton
        type="button"
        [class]="getTabClasses(panel)"
        [id]="tabId(panel)"
        [attr.aria-selected]="panel.active()"
        [attr.aria-controls]="panelDomId(panel)"
        [attr.tabindex]="panel.active() ? 0 : -1"
        [disabled]="panel.disabled()"
        role="tab"
        (click)="selectTab(panel.value())"
        (keydown)="onKeydown($event, panel.value())"
      >
        {{ panel.label() }}
      </button>
    }
  </div>

  <!-- Tab panels -->
  <div [class]="panelsContainerClasses()">
    <ng-content></ng-content>
  </div>
</div>
