packages:
  - docs

# ponytail: angular-eslint 22 resolves a stale @typescript-eslint/utils 8.50.0
# that references FlatESLint (removed in ESLint 10), crashing the lint run. Pin
# it to an ESLint-10-compatible version. Drop when angular-eslint dedupes to
# >=8.62 on its own.
overrides:
  '@typescript-eslint/utils': '8.62.0'

peerDependencyRules:
  allowedVersions:
    # Plugin declares eslint ^9 only; it works under ESLint 10.
    '@pegasusheavy/eslint-typescript-access>eslint': '10'
    # oxc-parser's wasm32-wasi binding (pulled in by @angular/build 22.3) ships
    # an @emnapi 2.0 pre-release outside @napi-rs/wasm-runtime's declared range.
    # The wasm binding is unused on platforms with native binaries.
    '@napi-rs/wasm-runtime>@emnapi/core': '2.0.0-alpha.6'
    '@napi-rs/wasm-runtime>@emnapi/runtime': '2.0.0-alpha.6'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - electron
  - esbuild
  - less
  - lmdb
  - msgpackr-extract

minimumReleaseAgeExclude:
  - prettier@3.9.3
