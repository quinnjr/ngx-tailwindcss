name: Publish to npm

# Publishes @quinnjr/ngx-tailwindcss with npm trusted publishing (OIDC).
# No NPM_TOKEN is used: npmjs.com must list this repository and this workflow
# file (publish.yml) as the package's trusted publisher. Provenance is attached
# automatically.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v1.1.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

concurrency:
  group: npm-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@^11.5.1

      # Install only root/library dependencies (docs needs the built library)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "!docs"

      - name: Build library
        run: pnpm run build

      - name: Run tests
        run: pnpm run test:run

      - name: Verify tag matches package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./dist/ngx-tailwindcss/package.json').version")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package version ${version}"
            exit 1
          fi

      - name: Publish
        working-directory: dist/ngx-tailwindcss
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) npm publish --access public --tag next ;;
            *) npm publish --access public ;;
          esac
